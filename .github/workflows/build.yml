name: build-dylib

on:
  push:
  workflow_dispatch:

jobs:
  dylib:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          rc=0
          make > build.log 2>&1 || rc=$?
          if [ $rc -ne 0 ]; then
            grep -E 'error:|fatal|No such file|not found|No rule|Stop\.' build.log \
              | tail -n 10 \
              | sed 's/%/%25/g' \
              | while IFS= read -r l; do echo "::error::$l"; done
            exit $rc
          fi
          tail -n 5 build.log

      - name: Collect dylib
        run: |
          mkdir -p out
          cp "$(find .theos -type f -name hongguospeed.dylib | head -n 1)" out/hongguospeed.dylib
          ls -l out
          file out/hongguospeed.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: hongguospeed-dylib
          path: out/hongguospeed.dylib
